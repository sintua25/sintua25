[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vouchocr"
version = "0.2.0"
description = "OCR lokal untuk dokumen vouching audit (Meja Vouching)."
requires-python = ">=3.11"
dependencies = [
    "rapidocr==3.10.0",        # Apache-2.0; model PP-OCR ONNX ikut di paket, tanpa unduhan
    "onnxruntime==1.31.1",     # MIT
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10",
    "openpyxl==3.1.5",         # MIT; tulis .xlsx tanpa Excel terpasang
    "pypdfium2==5.15.2",       # Apache-2.0/BSD-3; render halaman PDF (pdfium ikut di paket, offline)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vouchocr = "vouchocr.cli:main"

[tool.setuptools.packages.find]
include = ["vouchocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: tes yang menjalankan model OCR sungguhan (lebih lambat)"]
