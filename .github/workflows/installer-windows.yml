# Bikin installer satu klik (setup.exe) untuk Windows: aplikasi + Python + mesin OCR + model.
# Pengguna akhir tidak perlu memasang Python, Node, atau Rust.
name: Installer Windows

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths: ["app/**", "engine/**", ".github/workflows/installer-windows.yml"]

permissions:
  contents: write   # untuk mengunggah setup.exe ke halaman Releases

env:
  PYTHON_EMBED: "3.12.10"   # rilis 3.12 terakhir yang punya paket embeddable resmi

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_EMBED }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Tes mesin OCR (termasuk OCR sungguhan)
        working-directory: engine
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Siapkan Python bawaan + mesin OCR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "build/python"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $zip = "python-$env:PYTHON_EMBED-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_EMBED/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest
          # Aktifkan site-packages di Python embeddable.
          $pth = Get-ChildItem $dest -Filter "python*._pth" | Select-Object -First 1
          Set-Content $pth.FullName "python312.zip`r`n.`r`nLib\site-packages`r`nimport site"
          python -m pip install --no-cache-dir --target "$dest/Lib/site-packages" ./engine
          # Buang yang tidak perlu dibawa pengguna.
          Get-ChildItem "$dest/Lib/site-packages" -Recurse -Directory -Include "__pycache__","tests" | Remove-Item -Recurse -Force
          & "$dest/python.exe" -c "import vouchocr, rapidocr, onnxruntime, cv2, pypdfium2, openpyxl; print('mesin siap', vouchocr.__version__)"

      - name: Uji Python bawaan dengan foto contoh
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "import sys; sys.path.insert(0, 'engine/tests'); from pathlib import Path; from synth import KWITANSI, document, save; save(document(KWITANSI), Path('build/contoh/kwitansi.jpg'))"
          & build/python/python.exe -m vouchocr process build/contoh -w build/kerja-uji | Tee-Object build/uji.jsonl
          & build/python/python.exe -m vouchocr export -w build/kerja-uji
          & build/python/python.exe -m vouchocr verify -w build/kerja-uji
          if (-not (Select-String -Path build/uji.jsonl -Pattern '"processed": 1')) { throw "Foto contoh tidak terbaca" }

      - name: Bangun aplikasi + installer
        working-directory: app
        run: |
          npm ci
          npm test
          npx tauri build --config src-tauri/tauri.installer.conf.json

      - name: Kumpulkan setup.exe
        id: setup
        shell: pwsh
        run: |
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          $name = "Meja-Vouching-Setup.exe"
          Copy-Item $exe.FullName $name
          "{0:N0} MB" -f ((Get-Item $name).Length / 1MB)
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Meja-Vouching-Setup
          path: Meja-Vouching-Setup.exe

      - name: Unggah ke Releases (versi uji)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-terbaru
          name: Meja Vouching (installer terbaru)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: Meja-Vouching-Setup.exe
          body: |
            Installer satu klik untuk Windows 10/11 (64-bit). Download, double-click, Next sampai selesai.
            Kalau muncul "Windows protected your PC": klik "More info" lalu "Run anyway".
            Dibangun dari commit ${{ github.sha }}.
